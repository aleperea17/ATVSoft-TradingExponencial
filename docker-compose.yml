services:
  postgres:
    image: postgres:16-alpine
    container_name: te-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-te_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-te_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-trading_exponencial}
    volumes:
      - te_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - te_internal

volumes:
  te_pgdata:

networks:
  te_internal:
    driver: bridge
